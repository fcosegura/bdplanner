<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Birthday Planner</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BD Planner">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-color: #ff3b30;
            --accent-blue: #007aff;
            --glass-border: rgba(255, 255, 255, 0.4);
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: rgba(28, 28, 30, 0.7);
                --text-primary: #ffffff;
                --text-secondary: #aeaeb2;
                --accent-color: #ff453a;
                --accent-blue: #0a84ff;
                --glass-border: rgba(255, 255, 255, 0.1);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: calc(var(--safe-area-top) + 20px) 20px calc(var(--safe-area-bottom) + 100px) 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        header {
            margin-bottom: 30px;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-size: 36px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 17px;
            margin-top: 4px;
            font-weight: 300;
        }

        /* View Containers */
        .view {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .view.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:active {
            transform: scale(0.99);
        }

        /* Countdown Grid */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: rgba(142, 142, 147, 0.05);
            border-radius: 22px;
            border: 1px solid var(--glass-border);
            transition: background 0.3s ease;
        }

        .time-value {
            font-size: 36px;
            font-weight: 600;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(255, 59, 48, 0.2);
        }

        .time-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            font-weight: 600;
        }

        /* Gift List */
        .list-container {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid rgba(142, 142, 147, 0.1);
            animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item span {
            font-size: 18px;
            font-weight: 400;
        }

        .delete-btn {
            background: rgba(255, 59, 48, 0.08);
            color: var(--accent-color);
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s ease;
        }

        .delete-btn:active {
            background: rgba(255, 59, 48, 0.2);
        }

        /* Input Area */
        .input-group {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            align-items: center;
        }

        @media (prefers-color-scheme: light) {
            .input-group { background: rgba(0, 0, 0, 0.03); }
        }

        input[type="text"], input[type="date"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 14px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 17px;
            outline: none;
            min-width: 0; /* Fix for flex items */
        }

        /* Special handling for date input color scheme */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
            cursor: pointer;
        }

        @media (prefers-color-scheme: dark) {
            input[type="date"]::-webkit-calendar-picker-indicator {
                filter: invert(1);
            }
        }

        .add-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0 20px;
            height: 40px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .add-btn:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        /* Modern Floating Bottom Nav */
        .bottom-nav-wrapper {
            position: fixed;
            bottom: calc(25px + var(--safe-area-bottom));
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 1000;
            padding: 0 20px;
        }

        .bottom-nav {
            width: 100%;
            max-width: 380px;
            height: 76px;
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 38px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            animation: slideUpNav 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
            flex: 1;
            height: 100%;
            transition: all 0.3s ease;
            padding-top: 4px;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }

        .nav-icon-svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .nav-item.active .nav-icon-svg {
            transform: translateY(-2px);
        }

        .nav-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .nav-indicator {
            position: absolute;
            bottom: 12px;
            width: 5px;
            height: 5px;
            background: var(--accent-blue);
            border-radius: 50%;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .nav-item.active .nav-indicator {
            opacity: 1;
            transform: scale(1);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUpNav {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .age-display {
            text-align: center;
            margin-bottom: 24px;
        }

        .age-number {
            font-size: 56px;
            font-weight: 600;
            color: var(--accent-color);
            display: block;
            line-height: 1;
            margin: 10px 0;
            letter-spacing: -2px;
        }

        .age-text {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        /* Modal Style */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 32px 32px 0 0;
            padding: 30px;
            padding-bottom: calc(30px + var(--safe-area-bottom));
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .close-modal {
            background: rgba(142, 142, 147, 0.1);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-primary);
        }

        .modal-body .input-group {
            flex-direction: column;
            background: transparent;
            border: none;
            padding: 0;
            gap: 15px;
        }

        .modal-body .field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 16px;
        }

        @media (prefers-color-scheme: light) {
            .modal-body .field { background: rgba(0, 0, 0, 0.03); }
        }

        .modal-footer {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .secondary-btn {
            flex: 1;
            background: rgba(142, 142, 147, 0.1);
            color: var(--text-primary);
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
        }

        .primary-btn {
            flex: 2;
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }

        .gift-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .gift-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .edit-btn {
            background: rgba(0, 122, 255, 0.08);
            color: var(--accent-blue);
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
        }

        .fav-btn {
            background: transparent;
            border: none;
            padding: 0;
            margin-right: 12px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease;
        }

        .fav-btn.active {
            color: #ff2d55;
            animation: heartPulse 0.4s ease-out;
        }

        @keyframes heartPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header id="app-header">
        <h1>Cuenta Atrás</h1>
        <div class="subtitle" id="header-subtitle">Días para el gran momento</div>
    </header>

    <main>
        <!-- VIEW: COUNTDOWN -->
        <div id="view-countdown" class="view active">
            <div class="card">
                <div class="age-display">
                    <span class="age-text">Cumplirás</span>
                    <span id="next-age" class="age-number">--</span>
                    <span class="age-text">años</span>
                </div>
                <div class="countdown-grid">
                    <div class="time-unit">
                        <span id="days" class="time-value">0</span>
                        <span class="time-label">Días</span>
                    </div>
                    <div class="time-unit">
                        <span id="weeks" class="time-value">0</span>
                        <span class="time-label">Semanas</span>
                    </div>
                    <div class="time-unit">
                        <span id="hours" class="time-value">0</span>
                        <span class="time-label">Horas</span>
                    </div>
                    <div class="time-unit">
                        <span id="minutes" class="time-value">0</span>
                        <span class="time-label">Minutos</span>
                    </div>
                </div>
            </div>
            
            <div class="card" style="padding: 18px; text-align: center; border-style: dashed; background: transparent;">
                <p style="margin: 0; font-size: 15px; color: var(--text-secondary); font-weight: 400;" id="countdown-footer">
                    Calculando tiempo restante...
                </p>
            </div>
        </div>

        <!-- VIEW: GIFTS -->
        <div id="view-gifts" class="view">
            <div class="card">
                <h3 style="margin-top: 0; font-size: 22px; letter-spacing: -0.5px;">Lista de Deseos</h3>
                <ul id="gift-list" class="list-container">
                    <!-- Items injected here -->
                </ul>
                <div class="input-group">
                    <input type="text" id="gift-input" placeholder="Nombre del regalo...">
                    <button class="add-btn" onclick="openGiftModal()">Añadir</button>
                </div>
            </div>
        </div>

        <!-- VIEW: SETTINGS -->
        <div id="view-settings" class="view">
            <div class="card">
                <h3 style="margin-top: 0; font-size: 22px; letter-spacing: -0.5px;">Configuración</h3>
                <p style="color: var(--text-secondary); font-size: 16px; line-height: 1.5;">Introduce tu fecha de nacimiento para calcular tu cuenta atrás personalizada.</p>
                <div class="input-group" style="margin-top: 24px;">
                    <input type="date" id="birth-date-input">
                    <button class="add-btn" onclick="saveBirthDate()">Guardar</button>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL FOR GIFT DETAILS -->
    <div id="gift-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Detalles del Regalo</h2>
                <button class="close-modal" onclick="closeGiftModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <input type="text" id="modal-gift-name" class="field" placeholder="Nombre del regalo">
                    <input type="text" id="modal-gift-price" class="field" placeholder="Precio (ej: 50€)">
                    <input type="text" id="modal-gift-url" class="field" placeholder="Enlace del producto (URL)">
                </div>
            </div>
            <div class="modal-footer">
                <button class="secondary-btn" onclick="closeGiftModal()">Cancelar</button>
                <button class="primary-btn" id="modal-save-btn" onclick="saveGift()">Guardar Regalo</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav-wrapper">
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" onclick="switchView('countdown', this)">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="nav-label">Reloj</span>
                <div class="nav-indicator"></div>
            </a>
            <a href="#" class="nav-item" onclick="switchView('gifts', this)">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 12 20 22 4 22 4 12"></polyline>
                    <rect x="2" y="7" width="20" height="5"></rect>
                    <line x1="12" y1="22" x2="12" y2="7"></line>
                    <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                    <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                </svg>
                <span class="nav-label">Regalos</span>
                <div class="nav-indicator"></div>
            </a>
            <a href="#" class="nav-item" onclick="switchView('settings', this)">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span class="nav-label">Ajustes</span>
                <div class="nav-indicator"></div>
            </a>
        </nav>
    </div>

    <script>
        // State
        let birthDate = localStorage.getItem('bd_planner_birthdate');
        let gifts = JSON.parse(localStorage.getItem('bd_planner_gifts') || '[]');
        let editingIndex = -1;

        // Migration: convert gifts to latest structure
        gifts = gifts.map(g => {
            if (typeof g === 'string') return { name: g, price: '', url: '', isFavorite: false };
            if (!g.hasOwnProperty('isFavorite')) g.isFavorite = false;
            return g;
        });

        // Navigation
        function switchView(viewId, el) {
            const views = document.querySelectorAll('.view');
            const targetView = document.getElementById('view-' + viewId);
            
            if (targetView.classList.contains('active')) return;

            views.forEach(v => {
                v.classList.remove('active');
            });
            
            setTimeout(() => {
                targetView.classList.add('active');
            }, 50);
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');

            const headerTitle = document.querySelector('header h1');
            const headerSubtitle = document.getElementById('header-subtitle');

            if (viewId === 'countdown') {
                headerTitle.innerText = 'Cuenta Atrás';
                headerSubtitle.innerText = 'Días para el gran momento';
            } else if (viewId === 'gifts') {
                headerTitle.innerText = 'Auto-Regalos';
                headerSubtitle.innerText = 'Ideas para consentirte';
                renderGifts();
            } else {
                headerTitle.innerText = 'Ajustes';
                headerSubtitle.innerText = 'Configura tu perfil';
            }

            if (window.navigator.vibrate) window.navigator.vibrate(5);
        }

        // Favorite Logic
        function toggleFavorite(index) {
            gifts[index].isFavorite = !gifts[index].isFavorite;
            localStorage.setItem('bd_planner_gifts', JSON.stringify(gifts));
            renderGifts();
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        }

        // Modal Logic
        function openGiftModal(index = -1) {
            editingIndex = index;
            const modalTitle = document.getElementById('modal-title');
            const saveBtn = document.getElementById('modal-save-btn');
            
            if (editingIndex > -1) {
                const gift = gifts[editingIndex];
                document.getElementById('modal-gift-name').value = gift.name;
                document.getElementById('modal-gift-price').value = gift.price;
                document.getElementById('modal-gift-url').value = gift.url;
                modalTitle.innerText = 'Editar Regalo';
                saveBtn.innerText = 'Actualizar Regalo';
            } else {
                const initialName = document.getElementById('gift-input').value.trim();
                document.getElementById('modal-gift-name').value = initialName;
                document.getElementById('modal-gift-price').value = '';
                document.getElementById('modal-gift-url').value = '';
                modalTitle.innerText = 'Detalles del Regalo';
                saveBtn.innerText = 'Guardar Regalo';
            }
            
            document.getElementById('gift-modal').classList.add('active');
        }

        function closeGiftModal() {
            document.getElementById('gift-modal').classList.remove('active');
            editingIndex = -1;
        }

        function saveGift() {
            const name = document.getElementById('modal-gift-name').value.trim();
            const price = document.getElementById('modal-gift-price').value.trim();
            const url = document.getElementById('modal-gift-url').value.trim();

            if (name) {
                if (editingIndex > -1) {
                    gifts[editingIndex] = { ...gifts[editingIndex], name, price, url };
                } else {
                    gifts.push({ name, price, url, isFavorite: false });
                }
                
                localStorage.setItem('bd_planner_gifts', JSON.stringify(gifts));
                document.getElementById('gift-input').value = '';
                renderGifts();
                closeGiftModal();
            }
        }

        // Birthday Logic
        function saveBirthDate() {
            const input = document.getElementById('birth-date-input').value;
            if (input) {
                localStorage.setItem('bd_planner_birthdate', input);
                birthDate = input;
                updateCountdown();
                switchView('countdown', document.querySelector('.nav-item'));
            }
        }

        function updateCountdown() {
            if (!birthDate) {
                document.getElementById('countdown-footer').innerText = 'Por favor, configura tu fecha en Ajustes.';
                return;
            }

            const now = new Date();
            const birth = new Date(birthDate);
            
            let nextBD = new Date(now.getFullYear(), birth.getMonth(), birth.getDate());
            if (nextBD < now) {
                nextBD.setFullYear(now.getFullYear() + 1);
            }

            const age = nextBD.getFullYear() - birth.getFullYear();
            document.getElementById('next-age').innerText = age;

            const diff = nextBD - now;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const weeks = Math.floor(days / 7);
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            animateValue("days", days);
            animateValue("weeks", weeks);
            animateValue("hours", hours);
            animateValue("minutes", minutes);

            document.getElementById('countdown-footer').innerText = `¡Tu próximo cumple es el ${nextBD.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}!`;
        }

        function animateValue(id, value) {
            const el = document.getElementById(id);
            if (el.innerText !== value.toString()) {
                el.style.transform = "scale(1.2)";
                el.innerText = value;
                setTimeout(() => { el.style.transform = "scale(1)"; }, 200);
            }
        }

        // Gifts Logic
        function renderGifts() {
            const list = document.getElementById('gift-list');
            list.innerHTML = '';
            
            // Optional: sort favorites first
            const sortedGifts = [...gifts].map((g, i) => ({...g, originalIndex: i}))
                                .sort((a, b) => b.isFavorite - a.isFavorite);

            sortedGifts.forEach((gift, sortedIndex) => {
                const index = gift.originalIndex;
                const li = document.createElement('li');
                li.className = 'list-item';
                li.style.animationDelay = (sortedIndex * 0.05) + 's';
                
                let linkHtml = gift.url ? `
                    <a href="${gift.url.startsWith('http') ? gift.url : 'https://' + gift.url}" target="_blank" class="gift-link-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                    </a>
                ` : '';

                li.innerHTML = `
                    <button class="fav-btn ${gift.isFavorite ? 'active' : ''}" onclick="toggleFavorite(${index})">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="${gift.isFavorite ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                    <div class="gift-info">
                        <div style="display: flex; align-items: center;">
                            <span class="gift-name">${gift.name}</span>
                            ${linkHtml}
                        </div>
                        ${gift.price ? `<span class="gift-price">${gift.price}</span>` : ''}
                    </div>
                    <div class="gift-actions">
                        <button class="edit-btn" onclick="openGiftModal(${index})">Editar</button>
                        <button class="delete-btn" onclick="removeGift(${index})">Eliminar</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function removeGift(index) {
            // Find the list item visually
            const listItems = document.querySelectorAll('.list-item');
            // This is slightly tricky with sorting, but we can match by content or just re-render
            gifts.splice(index, 1);
            localStorage.setItem('bd_planner_gifts', JSON.stringify(gifts));
            renderGifts();
        }

        // Initialization
        window.addEventListener('load', () => {
            if (birthDate) {
                document.getElementById('birth-date-input').value = birthDate;
                updateCountdown();
                setInterval(updateCountdown, 60000);
            } else {
                switchView('settings', document.querySelectorAll('.nav-item')[2]);
            }
            renderGifts();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Error: ', err));
        }
    </script>
</body>
</html>
