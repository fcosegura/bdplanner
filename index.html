<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Personal Planner</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyPlanner">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-primary: #000000;
            --text-secondary: #8e8e93;
            --accent-color: #007aff;
            --glass-border: rgba(255, 255, 255, 0.3);
            --safe-area-top: env(safe-area-inset-top);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: rgba(28, 28, 30, 0.8);
                --text-primary: #ffffff;
                --text-secondary: #8e8e93;
                --accent-color: #0a84ff;
                --glass-border: rgba(255, 255, 255, 0.1);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: calc(var(--safe-area-top) + 20px) 20px 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 34px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 17px;
            margin-top: 5px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        textarea {
            width: 100%;
            height: 250px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 18px;
            line-height: 1.5;
            resize: none;
            outline: none;
            padding: 0;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .badge {
            background: var(--accent-color);
            color: white;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
        }

        /* Micro-animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.6s ease-out forwards;
        }

        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Planificador</h1>
        <div class="subtitle">Persistencia local en iPhone</div>
    </header>

    <main>
        <div class="card">
            <textarea id="editor" placeholder="Escribe tus ideas aquí..."></textarea>
            <div class="status-bar">
                <span id="save-status">Sincronizado</span>
                <span class="badge">Local Storage</span>
            </div>
        </div>
        
        <div class="card" style="padding: 15px;">
            <p style="margin: 0; font-size: 15px; color: var(--text-secondary);">
                💡 Esta app no envía datos a ningún servidor. Todo lo que escribes se guarda exclusivamente en este dispositivo.
            </p>
        </div>
    </main>

    <script>
        const editor = document.getElementById('editor');
        const saveStatus = document.getElementById('save-status');

        // Load data on startup
        window.addEventListener('load', () => {
            const savedContent = localStorage.getItem('pwa_planner_content');
            if (savedContent) {
                editor.value = savedContent;
            }
        });

        // Auto-save logic
        let timeout = null;
        editor.addEventListener('input', () => {
            saveStatus.innerText = 'Escribiendo...';
            
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                localStorage.setItem('pwa_planner_content', editor.value);
                saveStatus.innerText = 'Guardado ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                // Haptic feedback simulation if supported (mostly for Android, but good practice)
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            }, 800);
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Error: ', err));
            });
        }
    </script>
</body>
</html>
