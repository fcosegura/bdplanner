<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Birthday Planner</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BD Planner">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-color: #ff3b30;
            --accent-blue: #007aff;
            --glass-border: rgba(255, 255, 255, 0.4);
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: rgba(28, 28, 30, 0.7);
                --text-primary: #ffffff;
                --text-secondary: #aeaeb2;
                --accent-color: #ff453a;
                --accent-blue: #0a84ff;
                --glass-border: rgba(255, 255, 255, 0.1);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: calc(var(--safe-area-top) + 20px) 20px calc(var(--safe-area-bottom) + 100px) 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        header {
            margin-bottom: 30px;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-size: 36px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 17px;
            margin-top: 4px;
            font-weight: 300;
        }

        /* View Containers */
        .view {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .view.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:active {
            transform: scale(0.99);
        }

        /* Countdown Grid */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: rgba(142, 142, 147, 0.05);
            border-radius: 22px;
            border: 1px solid var(--glass-border);
            transition: background 0.3s ease;
        }

        .time-value {
            font-size: 36px;
            font-weight: 600;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(255, 59, 48, 0.2);
        }

        .time-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            font-weight: 600;
        }

        /* Gift List */
        .list-container {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid rgba(142, 142, 147, 0.1);
            animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item span {
            font-size: 18px;
            font-weight: 400;
        }

        .delete-btn {
            background: rgba(255, 59, 48, 0.08);
            color: var(--accent-color);
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s ease;
        }

        .delete-btn:active {
            background: rgba(255, 59, 48, 0.2);
        }

        /* Input Area */
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.03);
            padding: 8px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        @media (prefers-color-scheme: dark) {
            .input-group { background: rgba(255, 255, 255, 0.03); }
        }

        input[type="text"], input[type="date"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 17px;
            outline: none;
        }

        .add-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0 24px;
            height: 44px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .add-btn:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        /* Modern Floating Bottom Nav */
        .bottom-nav-wrapper {
            position: fixed;
            bottom: calc(20px + var(--safe-area-bottom));
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 1000;
            padding: 0 20px;
        }

        .bottom-nav {
            width: 100%;
            max-width: 400px;
            height: 72px;
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 36px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            animation: slideUpNav 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
            flex: 1;
            height: 100%;
            transition: color 0.3s ease;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }

        .nav-icon-svg {
            width: 26px;
            height: 26px;
            margin-bottom: 2px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .nav-item.active .nav-icon-svg {
            transform: translateY(-2px) scale(1.1);
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .nav-indicator {
            position: absolute;
            bottom: 8px;
            width: 4px;
            height: 4px;
            background: var(--accent-blue);
            border-radius: 50%;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .nav-item.active .nav-indicator {
            opacity: 1;
            transform: scale(1);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUpNav {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .age-display {
            text-align: center;
            margin-bottom: 24px;
        }

        .age-number {
            font-size: 56px;
            font-weight: 600;
            color: var(--accent-color);
            display: block;
            line-height: 1;
            margin: 10px 0;
            letter-spacing: -2px;
        }

        .age-text {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header id="app-header">
        <h1>Cuenta Atrás</h1>
        <div class="subtitle" id="header-subtitle">Días para el gran momento</div>
    </header>

    <main>
        <!-- VIEW: COUNTDOWN -->
        <div id="view-countdown" class="view active">
            <div class="card">
                <div class="age-display">
                    <span class="age-text">Cumplirás</span>
                    <span id="next-age" class="age-number">--</span>
                    <span class="age-text">años</span>
                </div>
                <div class="countdown-grid">
                    <div class="time-unit">
                        <span id="days" class="time-value">0</span>
                        <span class="time-label">Días</span>
                    </div>
                    <div class="time-unit">
                        <span id="weeks" class="time-value">0</span>
                        <span class="time-label">Semanas</span>
                    </div>
                    <div class="time-unit">
                        <span id="hours" class="time-value">0</span>
                        <span class="time-label">Horas</span>
                    </div>
                    <div class="time-unit">
                        <span id="minutes" class="time-value">0</span>
                        <span class="time-label">Minutos</span>
                    </div>
                </div>
            </div>
            
            <div class="card" style="padding: 18px; text-align: center; border-style: dashed; background: transparent;">
                <p style="margin: 0; font-size: 15px; color: var(--text-secondary); font-weight: 400;" id="countdown-footer">
                    Calculando tiempo restante...
                </p>
            </div>
        </div>

        <!-- VIEW: GIFTS -->
        <div id="view-gifts" class="view">
            <div class="card">
                <h3 style="margin-top: 0; font-size: 22px; letter-spacing: -0.5px;">Lista de Deseos</h3>
                <ul id="gift-list" class="list-container">
                    <!-- Items injected here -->
                </ul>
                <div class="input-group">
                    <input type="text" id="gift-input" placeholder="¿Qué te gustaría?">
                    <button class="add-btn" onclick="addGift()">Añadir</button>
                </div>
            </div>
        </div>

        <!-- VIEW: SETTINGS -->
        <div id="view-settings" class="view">
            <div class="card">
                <h3 style="margin-top: 0; font-size: 22px; letter-spacing: -0.5px;">Configuración</h3>
                <p style="color: var(--text-secondary); font-size: 16px; line-height: 1.5;">Introduce tu fecha de nacimiento para calcular tu cuenta atrás personalizada.</p>
                <div class="input-group" style="margin-top: 24px;">
                    <input type="date" id="birth-date-input">
                    <button class="add-btn" onclick="saveBirthDate()">Guardar</button>
                </div>
            </div>
        </div>
    </main>

    <div class="bottom-nav-wrapper">
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" onclick="switchView('countdown', this)">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="nav-label">Reloj</span>
                <div class="nav-indicator"></div>
            </a>
            <a href="#" class="nav-item" onclick="switchView('gifts', this)">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 12 20 22 4 22 4 12"></polyline>
                    <rect x="2" y="7" width="20" height="5"></rect>
                    <line x1="12" y1="22" x2="12" y2="7"></line>
                    <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                    <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                </svg>
                <span class="nav-label">Regalos</span>
                <div class="nav-indicator"></div>
            </a>
            <a href="#" class="nav-item" onclick="switchView('settings', this)">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span class="nav-label">Ajustes</span>
                <div class="nav-indicator"></div>
            </a>
        </nav>
    </div>

    <script>
        // State
        let birthDate = localStorage.getItem('bd_planner_birthdate');
        let gifts = JSON.parse(localStorage.getItem('bd_planner_gifts') || '[]');

        // Navigation
        function switchView(viewId, el) {
            const views = document.querySelectorAll('.view');
            const targetView = document.getElementById('view-' + viewId);
            
            if (targetView.classList.contains('active')) return;

            views.forEach(v => {
                v.classList.remove('active');
            });
            
            setTimeout(() => {
                targetView.classList.add('active');
            }, 50);
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');

            const headerTitle = document.querySelector('header h1');
            const headerSubtitle = document.getElementById('header-subtitle');

            if (viewId === 'countdown') {
                headerTitle.innerText = 'Cuenta Atrás';
                headerSubtitle.innerText = 'Días para el gran momento';
            } else if (viewId === 'gifts') {
                headerTitle.innerText = 'Auto-Regalos';
                headerSubtitle.innerText = 'Ideas para consentirte';
                renderGifts();
            } else {
                headerTitle.innerText = 'Ajustes';
                headerSubtitle.innerText = 'Configura tu perfil';
            }

            // Haptic-like feedback
            if (window.navigator.vibrate) window.navigator.vibrate(5);
        }

        // Birthday Logic
        function saveBirthDate() {
            const input = document.getElementById('birth-date-input').value;
            if (input) {
                localStorage.setItem('bd_planner_birthdate', input);
                birthDate = input;
                updateCountdown();
                switchView('countdown', document.querySelector('.nav-item'));
            }
        }

        function updateCountdown() {
            if (!birthDate) {
                document.getElementById('countdown-footer').innerText = 'Por favor, configura tu fecha en Ajustes.';
                return;
            }

            const now = new Date();
            const birth = new Date(birthDate);
            
            let nextBD = new Date(now.getFullYear(), birth.getMonth(), birth.getDate());
            if (nextBD < now) {
                nextBD.setFullYear(now.getFullYear() + 1);
            }

            const age = nextBD.getFullYear() - birth.getFullYear();
            document.getElementById('next-age').innerText = age;

            const diff = nextBD - now;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const weeks = Math.floor(days / 7);
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            // Animate numbers if they change
            animateValue("days", days);
            animateValue("weeks", weeks);
            animateValue("hours", hours);
            animateValue("minutes", minutes);

            document.getElementById('countdown-footer').innerText = `¡Tu próximo cumple es el ${nextBD.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}!`;
        }

        function animateValue(id, value) {
            const el = document.getElementById(id);
            if (el.innerText !== value.toString()) {
                el.style.transform = "scale(1.2)";
                el.innerText = value;
                setTimeout(() => { el.style.transform = "scale(1)"; }, 200);
            }
        }

        // Gifts Logic
        function renderGifts() {
            const list = document.getElementById('gift-list');
            list.innerHTML = '';
            gifts.forEach((gift, index) => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.style.animationDelay = (index * 0.05) + 's';
                li.innerHTML = `
                    <span>${gift}</span>
                    <button class="delete-btn" onclick="removeGift(${index})">Eliminar</button>
                `;
                list.appendChild(li);
            });
        }

        function addGift() {
            const input = document.getElementById('gift-input');
            if (input.value.trim()) {
                gifts.push(input.value.trim());
                localStorage.setItem('bd_planner_gifts', JSON.stringify(gifts));
                input.value = '';
                renderGifts();
            }
        }

        function removeGift(index) {
            const items = document.querySelectorAll('.list-item');
            items[index].style.transform = "translateX(100px)";
            items[index].style.opacity = "0";
            
            setTimeout(() => {
                gifts.splice(index, 1);
                localStorage.setItem('bd_planner_gifts', JSON.stringify(gifts));
                renderGifts();
            }, 300);
        }

        // Initialization
        window.addEventListener('load', () => {
            if (birthDate) {
                document.getElementById('birth-date-input').value = birthDate;
                updateCountdown();
                setInterval(updateCountdown, 60000);
            } else {
                switchView('settings', document.querySelectorAll('.nav-item')[2]);
            }
            renderGifts();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Error: ', err));
        }
    </script>
</body>
</html>
